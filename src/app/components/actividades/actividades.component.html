<section class="contenedor-actividades">
  <h2>Actividades y Talleres Disponibles</h2>
  <div class="tarjetas">
    @for (actividad of actividades; track actividad.nombre) {
      <div class="tarjeta">
        <h3>{{ actividad.nombre }}</h3>
        <p>{{ actividad.descripcion }}</p>
        <p><strong>Horario:</strong> {{ actividad.horario }}</p>
      </div>
    }
  </div>
</section>
